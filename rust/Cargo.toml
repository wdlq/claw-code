[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
# deny 而非 forbid：允许特定函数用 #[allow(unsafe_code)] 豁免（如 Windows Console FFI）。
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

# Win7 生产诊断：release 保留行号表，claw_panic.log 的 backtrace 能看到
# 文件:行；诊断结束后可移除以缩小体积。
[profile.release]
debug = "line-tables-only"
